# ❄️ BREEZE DARK KITTY CONFIG

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 11.0
window_padding_width 10

# Breeze Dark background and transparency
background_opacity 0.85
background #202326
foreground #fcfcfc

# Selection colors (Breeze Highlight Blue)
selection_background #3daee9
selection_foreground #fcfcfc

# Cursor
cursor #3daee9
cursor_shape beam
cursor_beam_thickness 1.5

# Tabs
tab_bar_style powerline
active_tab_foreground   #202326
active_tab_background   #3daee9
inactive_tab_foreground #fcfcfc
inactive_tab_background #2a2e32

# Color Palette (Breeze Dark)
color0 #232629
color1 #ed1515
color2 #11d116
color3 #fdbc4b
color4 #1d99f3
color5 #9b59b6
color6 #1abc9c
color7 #fcfcfc

color8 #7f8c8d
color9 #c0392b
color10 #1cdc9a
color11 #fdbc4b
color12 #3daee9
color13 #8e44ad
color14 #16a085
color15 #ffffff

# Disable confirm on close for smoother workflow
confirm_os_window_close 0
