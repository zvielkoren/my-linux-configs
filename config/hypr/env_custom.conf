# 🎨 TOKYO NIGHT - AMETHYST EDITION
# Redesigned for a sleek, modern look

decoration {
    rounding = 12
    active_opacity = 0.95
    inactive_opacity = 0.85
    
    blur {
        enabled = true
        size = 12
        passes = 4
        new_optimizations = true
        xray = true
        noise = 0.02
    }
    
    shadow {
        enabled = true
        range = 30
        render_power = 4
        color = rgba(bb9af733)
    }
}

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    col.active_border = rgba(bb9af7ee) rgba(7dcfffee) 45deg
    col.inactive_border = rgba(1a1b26aa)
}

# Auto-launch your custom UI
exec = pkill quickshell; quickshell
